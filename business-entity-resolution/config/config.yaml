# config/config.yaml
# Single source of truth — nothing below should ever be hardcoded in code.

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  candidates_dir: "output"
  reports_dir: "reports"
  submission_dir: "output"

  train_source1: "data/raw/train_source1.tsv"
  train_source2: "data/raw/train_source2.tsv"
  train_source3: "data/raw/train_source3.tsv"
  train_ground_truth: "data/raw/train_ground_truth.tsv"

  test_source1: "data/raw/test_source1.tsv"
  test_source2: "data/raw/test_source2.tsv"
  test_source3: "data/raw/test_source3.tsv"

  candidate_pairs_out: "output/candidate_pairs.tsv"
  matching_results_out: "output/matching_results.tsv"

schema:
  id_column: "entity_id"
  name_column: "business_name"
  address_column: "business_address"
  country_column: "country"
  source_prefixes:
    source1: "S1-"
    source2: "S2-"
    source3: "S3-"

normalization:
  keep_multi_view: true          # NEVER overwrite original — always emit all views below
  name_views: ["name_original", "name_basic_norm", "name_token_norm", "name_alnum_norm", "name_transliterated"]
  address_views: ["address_original", "address_basic_norm", "address_component_parsed"]
  legal_suffix_dictionary: "config/legal_suffixes.yaml"
  address_abbreviation_dictionary: "config/address_abbreviations.yaml"
  transliteration_enabled: true
  address_component_parsing: true

eda:
  run_first: true
  report_out: "reports/eda_report.md"

blocking:
  target_recall: 0.95            # minimum acceptable; investigate 0.97-0.99 if feasible
  max_candidates_per_entity: 50  # hard cap, tune after seeing EDA candidate-count distribution
  strategies:
    - name: "exact_name"          # BLOCK A
      view: "name_alnum_norm"
      method: "exact"
    - name: "name_token_overlap"  # BLOCK B
      view: "name_token_norm"
      method: "jaccard"
      top_k: 20
      max_token_frequency: 100000
      max_scoring_candidates: 100

    - name: "name_char_ngram" # Block C
      view: "name_basic_norm"
      method: "char_ngram"
      ngram_size: 3
      top_k: 20
      max_ngram_frequency: 50000
      max_query_ngrams: 8
      max_scoring_candidates: 100

    - name: "name_phonetic"        # BLOCK D
      view: "name_transliterated"
      method: "phonetic"          # soundex / double_metaphone
      top_k: 20
    - name: "address_token"        # BLOCK E
      view: "address_basic_norm"
      method: "token_overlap"
      top_k: 20
    - name: "address_component"    # BLOCK F
      view: "address_component_parsed"
      method: "component_match"   # postal / city match
    - name: "city_plus_name"      # BLOCK G
      method: "combined"
      top_k: 20
    - name: "tfidf_combined"      # BLOCK H
      method: "tfidf_nn"
      max_features: 30000
      top_k: 20
    - name: "embedding_nn"        # BLOCK I
      method: "embedding_nn"
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      top_k: 20
  structured_soft_signal: ["country"]   # never a hard filter — France unseen in train
  report_per_blocker_recall: true
  report_out: "reports/blocking_recall_report.md"

features:
  string_similarity: true
  tfidf:
    enabled: true
    char_ngram: true
    ngram_range: [2, 4]
    max_features: 30000
    fit_per_fold: true            # avoid validation leakage
  embedding:
    enabled: true
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    batch_size: 32
  address_component_overlap: true
  phonetic_match: true
  relative_features:              # NEW
    enabled: true
    fields: ["candidate_rank", "top_score", "score_gap_from_top",
             "score_gap_from_second", "number_of_candidates",
             "number_above_0_5", "number_above_0_7"]
  source_type_feature: true
  dtype: "float32"

model:
  type: "lightgbm"
  params:
    objective: "binary"
    metric: "auc"
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 500
  cv:
    method: "entity_level_kfold"
    n_folds: 5
    random_seed: 42
  ablation:
    enabled: true
    report_out: "reports/feature_ablation.md"
  hard_negative_mining:            # NEW
    enabled: true
    rounds: 1
    report_out: "reports/hard_negative_report.md"

evaluation:
  metric: "f0.5"
  average: "macro"
  entity_level: true
  singleton_aware: true

decision_strategy:                 # NEW — compare, don't assume
  candidates: ["global_threshold", "top_score_margin", "entity_adaptive"]
  selected:
    strategy: "global_threshold"
    threshold: 0.25
    margin: 0.1
  global_threshold:
    search_range: [0.1, 0.9]
    search_step: 0.02
  top_score_margin:
    margin_search_range: [0.02, 0.3]
  high_precision_rules:
    enabled: true
    validate_each_rule: true       # drop any rule that doesn't measurably help on validation
  report_out: "reports/decision_strategy_report.md"

validation_stability:              # NEW
  n_seeds: 3
  track_public_vs_local: true
  log_out: "reports/leaderboard_tracking.md"

submission:
  validator_script: "src/submission/validate_submission.py"
  output_columns:
    matching_results: ["source1_entity_id", "matched_entity_ids"]
    candidate_pairs: ["source1_entity_id", "candidate_entity_ids"]

runtime:
  low_memory_mode: true
  chunk_size: 5000
  n_jobs: 2
